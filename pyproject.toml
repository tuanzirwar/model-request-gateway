[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model-request-gateway"
version = "0.2.0"
description = "Coding Agent 模型请求并发与流式资源管理网关"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "sqlalchemy>=2,<3", "pymysql[rsa]>=1.1,<2", "redis>=5,<9", "alembic>=1.14,<2", "PyYAML>=6,<7", "prometheus-client>=0.21,<1"]

[project.urls]
Repository = "https://github.com/tuanzirwar/model-request-gateway"

[tool.setuptools.package-data]
model_gateway = ["static/*.html", "static/*.css", "static/*.js"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1", "build>=1"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/model_gateway/app.py" = ["B008"] # FastAPI依赖注入的惯用声明
