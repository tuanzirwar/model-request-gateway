<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型接入工作台</title><link rel="stylesheet" href="/static/console.css"></head><body>
<header><small>MODEL REQUEST GATEWAY</small><h1>模型接入工作台</h1><p>生成、取消与请求状态，都有可追踪的记录。</p><span id="health">检查服务…</span></header>
<main><section class="card"><h2>应用连接</h2><p>密钥只保存在页面内存中，刷新或退出后清除。</p><form id="login"><input id="key" type="password" autocomplete="off" placeholder="应用 API 密钥" required><button>连接</button><button id="logout" type="button" class="secondary">退出</button></form><p id="notice" role="status"></p></section>
<section class="summary"><div class="card"><small>近24小时请求</small><strong id="total">—</strong></div><div class="card"><small>成功</small><strong id="success">—</strong></div><div class="card"><small>失败 / 取消 / 拒绝</small><strong id="other">—</strong></div><div class="card"><small>已报告 tokens</small><strong id="tokens">—</strong></div></section>
<div class="columns"><section class="card"><h2>试用生成</h2><p>只发送本次输入，不自动续接历史或重试。</p><form id="generate"><label>授权模型<select id="model" required></select></label><label>输入<textarea id="prompt" rows="5" placeholder="用三句话解释 HTTP 超时和请求取消的区别。" required></textarea></label><button id="start" disabled>开始生成</button><button id="stop" type="button" class="secondary" disabled>停止</button></form><p id="state">等待输入</p><code id="request-id"></code><pre id="answer" aria-live="polite"></pre><details><summary>工具调用与推理分片</summary><pre id="extra"></pre></details></section>
<section class="card"><div class="heading"><h2>请求记录</h2><button id="refresh" class="secondary">刷新</button></div><div class="filters"><select id="status"><option value="">全部状态</option><option>succeeded</option><option>failed</option><option>cancelled</option><option>rejected</option><option>running</option><option>abandoned</option></select><select id="filter-model"><option value="">全部模型</option></select></div><div class="table"><table><thead><tr><th>时间</th><th>模型</th><th>状态</th><th>首帧</th></tr></thead><tbody id="rows"></tbody></table></div><button id="more" class="secondary" disabled>下一页</button><pre id="detail">点击记录查看错误码、终态和 usage。</pre></section></div><footer>默认不保存提示词和答案；首帧不等于首个可见文本，已报告 tokens 不能作为完整账单。<a href="/docs">API 文档</a></footer></main><script src="/static/console.js" defer></script></body></html>
