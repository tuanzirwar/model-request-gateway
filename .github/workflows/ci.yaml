name: gateway-checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: ci-root-only, MYSQL_DATABASE: model_gateway_test}
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-only --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=10
    env:
      GATEWAY_CONFIG: gateway.example.yaml
      GATEWAY_DATABASE_URL: mysql+pymysql://root:ci-root-only@127.0.0.1:3306/model_gateway_test
      GATEWAY_TEST_MYSQL: mysql+pymysql://root:ci-root-only@127.0.0.1:3306/model_gateway_test
      GATEWAY_TEST_REDIS: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: python -m alembic upgrade head
      - run: python -m pytest -q --junitxml=reports/junit.xml
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m build
